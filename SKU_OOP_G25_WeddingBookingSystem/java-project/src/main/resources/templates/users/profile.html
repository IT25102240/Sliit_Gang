<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>My Profile – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .avatar { width:80px; height:80px; background:linear-gradient(135deg,#7c3f58,#c4956a); border-radius:50%;
                  display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; }
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
    <div class="d-flex gap-3">
        <a class="nav-link" href="/bookings">Bookings</a>
        <a class="nav-link" href="/reviews">Reviews</a>
        <a class="nav-link" href="/logout">Sign Out</a>
    </div>
</div></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="d-flex align-items-center gap-4 mb-4">
                    <div class="avatar"><i class="bi bi-person"></i></div>
                    <div>
                        <h4 class="fw-bold mb-1" th:text="${currentUser.name}">Name</h4>
                        <span class="badge" style="background:#7c3f58;" th:text="${currentUser.role}">role</span>
                    </div>
                </div>
                <table class="table">
                    <tr><td class="text-muted fw-semibold">User ID</td><td th:text="${currentUser.id}"></td></tr>
                    <tr><td class="text-muted fw-semibold">Email</td><td th:text="${currentUser.email}"></td></tr>
                    <tr><td class="text-muted fw-semibold">Phone</td><td th:text="${currentUser.phone}"></td></tr>
                    <tr><td class="text-muted fw-semibold">Role</td><td th:text="${currentUser.role}"></td></tr>
                </table>
                <div class="d-flex gap-2 mt-2">
                    <a href="/bookings" class="btn btn-primary"><i class="bi bi-calendar me-1"></i>My Bookings</a>
                    <a href="/reviews/submit" class="btn btn-outline-secondary"><i class="bi bi-star me-1"></i>Write a Review</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
