<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>User Management – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; }
        .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .page-header { background:linear-gradient(135deg,#7c3f58,#a0556e); color:#fff; padding:2.5rem 0; margin-bottom:2rem; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .role-admin { background:#fce7f3; color:#9d174d; border-radius:6px; padding:2px 10px; font-size:.8rem; }
        .role-customer { background:#d1fae5; color:#065f46; border-radius:6px; padding:2px 10px; font-size:.8rem; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
        <div class="d-flex gap-3">
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/packages">Packages</a>
            <a class="nav-link" href="/bookings">Bookings</a>
            <a class="nav-link" href="/logout">Sign Out</a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h2 class="fw-bold mb-1"><i class="bi bi-people me-2"></i>User Management</h2>
        <p class="mb-0 opacity-75">Manage all registered users — Vidura's Component</p>
    </div>
</div>

<!-- Flash messages -->
<div class="container" th:if="${success != null}">
    <div class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
</div>
<div class="container" th:if="${error != null}">
    <div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span></div>
</div>

<div class="container">
    <!-- Search -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/users}" method="get" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Search by Name</label>
                    <input type="text" name="search" class="form-control" placeholder="Enter name..." th:value="${search}"/>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Search</button>
                </div>
                <div class="col-md-2">
                    <a href="/users" class="btn btn-outline-secondary w-100">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Users Table -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-people me-2"></i>All Users (<span th:text="${users.size()}"></span>)</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="text-muted small" th:text="${user.id}"></td>
                            <td class="fw-semibold" th:text="${user.name}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.phone}"></td>
                            <td>
                                <span th:classappend="${user.role == 'admin' ? 'role-admin' : 'role-customer'}"
                                      th:text="${user.role}"></span>
                            </td>
                            <td>
                                <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display:inline"
                                      onsubmit="return confirm('Delete this user?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${users.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">No users found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
