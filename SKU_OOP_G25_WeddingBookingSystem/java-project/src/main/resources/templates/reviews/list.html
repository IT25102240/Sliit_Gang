<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Reviews – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .page-header { background:linear-gradient(135deg,#7c3f58,#a0556e); color:#fff; padding:2.5rem 0; margin-bottom:2rem; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .review-card { border:1px solid #e8d5c4; border-radius:16px; padding:1.5rem; background:#fff; transition:transform 0.2s; }
        .review-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(124,63,88,0.1); }
        .star { color:#f59e0b; }
        .badge-public { background:#e0f2fe; color:#0369a1; border-radius:20px; padding:2px 10px; font-size:.75rem; }
        .badge-verified { background:#d1fae5; color:#065f46; border-radius:20px; padding:2px 10px; font-size:.75rem; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-link" href="/packages">Packages</a>
            <th:block th:if="${currentUser != null}">
                <a class="nav-link" href="/bookings">Bookings</a>
                <a class="nav-link" href="/logout">Sign Out</a>
            </th:block>
            <th:block th:if="${currentUser == null}">
                <a class="nav-link" href="/login">Sign In</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-star me-2"></i>Guest Reviews</h2>
            <p class="mb-0 opacity-75">Chanuka's Component — Real stories from wedding couples</p>
        </div>
        <a th:if="${currentUser != null}" href="/reviews/submit" class="btn btn-light">
            <i class="bi bi-pencil me-1"></i>Write a Review
        </a>
    </div>
</div>

<!-- Flash -->
<div class="container mb-3" th:if="${success != null}">
    <div class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
</div>
<div class="container mb-3" th:if="${error != null}">
    <div class="alert alert-danger"><span th:text="${error}"></span></div>
</div>

<div class="container">
    <div class="row g-4">
        <div class="col-md-6" th:each="r : ${reviews}">
            <div class="review-card">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <span class="fw-bold" th:text="${r.userName}"></span>
                        <span th:if="${r.reviewType == 'VERIFIED'}" class="badge-verified ms-2">Verified</span>
                        <span th:if="${r.reviewType == 'PUBLIC'}" class="badge-public ms-2">Public</span>
                    </div>
                    <div class="d-flex gap-1">
                        <th:block th:each="i : ${#numbers.sequence(1,5)}">
                            <i th:classappend="${i <= r.rating ? 'star bi bi-star-fill' : 'bi bi-star text-muted'}"></i>
                        </th:block>
                    </div>
                </div>
                <div class="text-muted small mb-2" th:text="${r.packageName}"></div>
                <h6 class="fw-semibold mb-1" th:text="${r.title}"></h6>
                <p class="text-muted small mb-2" th:text="${r.comment}"></p>
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-muted" th:text="${r.createdDate}"></small>
                    <th:block th:if="${currentUser != null and (currentUser.role == 'admin' or currentUser.id == r.userId)}">
                        <div class="d-flex gap-1">
                            <a th:href="@{/reviews/edit/{id}(id=${r.reviewId})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/reviews/delete/{id}(id=${r.reviewId})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Delete this review?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
        <div class="col-12 text-center py-5 text-muted" th:if="${reviews.isEmpty()}">
            <i class="bi bi-star" style="font-size:3rem;opacity:.2;"></i>
            <p class="mt-2">No reviews yet. Be the first to share your experience!</p>
            <a href="/reviews/submit" class="btn btn-primary" th:if="${currentUser != null}">Write a Review</a>
        </div>
    </div>
</div>
<div style="height:3rem;"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
