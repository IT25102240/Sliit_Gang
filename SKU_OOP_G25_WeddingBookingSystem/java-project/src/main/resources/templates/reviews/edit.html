<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Review – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .form-control:focus { border-color:#c4956a; box-shadow:0 0 0 .2rem rgba(196,149,106,.25); }
        .card-header { background:#7c3f58; color:#fff; }
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a class="navbar-brand fw-bold" href="/">EverAfter</a>
    <a class="nav-link" href="/reviews">Back</a>
</div></nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Edit Review</div>
                <div class="card-body p-4">
                    <form th:action="@{/reviews/update/{id}(id=${review.reviewId})}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Rating (1–5)</label>
                            <input type="number" name="rating" class="form-control" min="1" max="5" th:value="${review.rating}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Title</label>
                            <input type="text" name="title" class="form-control" th:value="${review.title}" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Comment</label>
                            <textarea name="comment" class="form-control" rows="4" th:text="${review.comment}" required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">Save Changes</button>
                            <a href="/reviews" class="btn btn-outline-secondary flex-fill">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
