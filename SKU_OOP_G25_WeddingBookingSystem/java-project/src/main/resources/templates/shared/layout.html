<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wedding Booking System - SKU_OOP_G25</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root {
            --primary: #7c3f58;
            --primary-light: #a0556e;
            --accent: #c4956a;
            --bg: #fdf8f4;
            --card-bg: #ffffff;
        }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; }
        .navbar { background: var(--primary) !important; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .nav-link:hover { color: var(--accent) !important; }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-light); border-color: var(--primary-light); }
        .btn-outline-primary { color: var(--primary); border-color: var(--primary); }
        .btn-outline-primary:hover { background: var(--primary); color: #fff; }
        .badge-status-pending { background: #fef3c7; color: #92400e; }
        .badge-status-confirmed { background: #d1fae5; color: #065f46; }
        .badge-status-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-status-completed { background: #dbeafe; color: #1e40af; }
        .card { border: 1px solid #e8d5c4; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card-header { background: var(--primary); color: #fff; }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
                       color: #fff; padding: 2.5rem 0; margin-bottom: 2rem; }
        .star-filled { color: #f59e0b; }
        .footer { background: var(--primary); color: #e8d5c4; padding: 1.5rem 0; margin-top: 4rem; }
        .alert-success { background: #d1fae5; border-color: #34d399; color: #065f46; }
        .alert-danger { background: #fee2e2; border-color: #f87171; color: #991b1b; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-heart-fill me-2"></i>EverAfter Weddings
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/packages"><i class="bi bi-gift me-1"></i>Packages</a></li>
                <li class="nav-item"><a class="nav-link" href="/reviews"><i class="bi bi-star me-1"></i>Reviews</a></li>
                <th:block th:if="${currentUser != null}">
                    <th:block th:if="${currentUser.role == 'admin'}">
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people me-1"></i>Users</a></li>
                        <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-bar-chart me-1"></i>Dashboard</a></li>
                    </th:block>
                    <li class="nav-item"><a class="nav-link" href="/bookings"><i class="bi bi-calendar me-1"></i>Bookings</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i><span th:text="${currentUser.name}">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"/></li>
                            <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
                        </ul>
                    </li>
                </th:block>
                <th:block th:if="${currentUser == null}">
                    <li class="nav-item"><a class="nav-link" href="/login">Sign In</a></li>
                    <li class="nav-item ms-2"><a class="btn btn-sm" style="background:#c4956a;color:#fff;border-radius:20px;padding:6px 18px;" href="/register">Get Started</a></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<!-- FLASH MESSAGES -->
<div class="container mt-3" th:if="${success != null}">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<div class="container mt-3" th:if="${error != null}">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
