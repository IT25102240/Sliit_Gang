<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Booking Detail – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .card-header { background:#7c3f58; color:#fff; }
        .status-pending { background:#fef3c7; color:#92400e; border-radius:6px; padding:3px 12px; font-weight:600; }
        .status-confirmed { background:#d1fae5; color:#065f46; border-radius:6px; padding:3px 12px; font-weight:600; }
        .status-cancelled { background:#fee2e2; color:#991b1b; border-radius:6px; padding:3px 12px; font-weight:600; }
        .status-completed { background:#dbeafe; color:#1e40af; border-radius:6px; padding:3px 12px; font-weight:600; }
        .form-control:focus,.form-select:focus { border-color:#c4956a; box-shadow:0 0 0 .2rem rgba(196,149,106,.25); }
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
    <a class="nav-link" href="/bookings"><i class="bi bi-arrow-left me-1"></i>All Bookings</a>
</div></nav>

<!-- Flash messages -->
<div class="container mt-3" th:if="${success != null}">
    <div class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
</div>

<div class="container py-5">
    <h3 class="fw-bold mb-4"><i class="bi bi-calendar-check me-2" style="color:#7c3f58;"></i>Booking Details</h3>

    <div class="row g-4">
        <!-- Booking Info -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header"><i class="bi bi-info-circle me-2"></i>Booking Information</div>
                <div class="card-body">
                    <table class="table table-borderless mb-0">
                        <tr><td class="text-muted fw-semibold">Booking ID</td><td th:text="${booking.bookingId}"></td></tr>
                        <tr><td class="text-muted fw-semibold">Package</td><td class="fw-bold" th:text="${booking.packageName}"></td></tr>
                        <tr><td class="text-muted fw-semibold">Status</td>
                            <td><span th:classappend="'status-' + ${booking.status}" th:text="${booking.status}"></span></td></tr>
                        <tr><td class="text-muted fw-semibold">Event Date</td><td th:text="${booking.eventDate}"></td></tr>
                        <tr><td class="text-muted fw-semibold">Guests</td><td th:text="${booking.guestCount}"></td></tr>
                        <tr><td class="text-muted fw-semibold">Venue</td><td th:text="${booking.venueName}"></td></tr>
                        <tr><td class="text-muted fw-semibold">Total Amount</td>
                            <td class="fw-bold fs-5" style="color:#7c3f58;" th:text="'$' + ${booking.totalAmount}"></td></tr>
                        <tr th:if="${booking.specialRequests != null and !booking.specialRequests.isEmpty()}">
                            <td class="text-muted fw-semibold">Special Requests</td>
                            <td th:text="${booking.specialRequests}"></td>
                        </tr>
                    </table>

                    <!-- Status update (admin only) -->
                    <div th:if="${currentUser.role == 'admin'}" class="mt-3 pt-3 border-top">
                        <form th:action="@{/bookings/status/{id}(id=${booking.bookingId})}" method="post" class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm">
                                <option value="pending" th:selected="${booking.status == 'pending'}">Pending</option>
                                <option value="confirmed" th:selected="${booking.status == 'confirmed'}">Confirmed</option>
                                <option value="cancelled" th:selected="${booking.status == 'cancelled'}">Cancelled</option>
                                <option value="completed" th:selected="${booking.status == 'completed'}">Completed</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Update</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payment Summary -->
        <div class="col-lg-6">
            <div class="card mb-4">
                <div class="card-header"><i class="bi bi-credit-card me-2"></i>Payment Summary</div>
                <div class="card-body">
                    <div class="d-flex justify-content-between py-2 border-bottom">
                        <span class="text-muted">Total Amount</span>
                        <strong th:text="'$' + ${booking.totalAmount}"></strong>
                    </div>
                    <div class="d-flex justify-content-between py-2 border-bottom text-success">
                        <span>Paid</span>
                        <strong th:text="'$' + ${totalPaid}"></strong>
                    </div>
                    <div class="d-flex justify-content-between py-2">
                        <span class="fw-bold">Remaining</span>
                        <strong th:classappend="${remaining > 0 ? 'text-danger' : 'text-success'}"
                                th:text="'$' + ${remaining}"></strong>
                    </div>
                </div>
            </div>

            <!-- Payment History -->
            <div class="card mb-4">
                <div class="card-header"><i class="bi bi-clock-history me-2"></i>Payment History</div>
                <div class="card-body p-0">
                    <div th:if="${payments.isEmpty()}" class="text-center text-muted py-3">No payments recorded</div>
                    <div th:each="p : ${payments}" class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                        <div>
                            <div class="fw-semibold" th:text="'$' + ${p.amount}"></div>
                            <div class="text-muted small" th:text="${p.method} + ' · ' + ${p.paymentDate}"></div>
                        </div>
                        <span class="badge" style="background:#22c55e;" th:text="${p.status}"></span>
                    </div>
                </div>
            </div>

            <!-- Record Payment (admin/vendor) -->
            <div class="card" th:if="${currentUser.role == 'admin' or currentUser.role == 'vendor'}">
                <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Record Payment</div>
                <div class="card-body">
                    <form th:action="@{/bookings/{id}/payment(id=${booking.bookingId})}" method="post">
                        <div class="row g-2">
                            <div class="col-md-5">
                                <input type="number" name="amount" class="form-control" placeholder="Amount ($)" step="0.01" required/>
                            </div>
                            <div class="col-md-4">
                                <select name="method" class="form-select">
                                    <option value="cash">Cash</option>
                                    <option value="card">Card</option>
                                    <option value="bank_transfer">Bank Transfer</option>
                                    <option value="online">Online</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn btn-primary w-100">Record</button>
                            </div>
                            <div class="col-12">
                                <input type="text" name="transactionRef" class="form-control" placeholder="Transaction Reference (optional)"/>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
