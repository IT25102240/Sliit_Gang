<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Create Booking – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .form-control:focus,.form-select:focus { border-color:#c4956a; box-shadow:0 0 0 .2rem rgba(196,149,106,.25); }
        .card-header { background:#7c3f58; color:#fff; }
        .pkg-summary { background:linear-gradient(135deg,#f3e8ee,#fdf2e9); border-radius:12px; padding:1.5rem; margin-bottom:2rem; }
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
    <a class="nav-link" href="/packages">Back to Packages</a>
</div></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <!-- Package Summary -->
            <div class="pkg-summary">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="fw-bold mb-1" th:text="${pkg.name}"></h5>
                        <p class="text-muted mb-0 small" th:text="${pkg.description}"></p>
                        <div class="mt-2 text-muted small">
                            <i class="bi bi-people me-1"></i>Max <span th:text="${pkg.maxGuests}"></span> guests &nbsp;|&nbsp;
                            <i class="bi bi-shop me-1"></i><span th:text="${pkg.vendorName}"></span>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold fs-4" style="color:#7c3f58;" th:text="'$' + ${pkg.price}"></div>
                        <small class="text-muted" th:text="${pkg.packageType}"></small>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="bi bi-calendar-plus me-2"></i>Book This Package — Daham</div>
                <div class="card-body p-4">
                    <form th:action="@{/bookings/create}" method="post">
                        <input type="hidden" name="packageId" th:value="${pkg.id}"/>
                        <input type="hidden" name="packageName" th:value="${pkg.name}"/>
                        <input type="hidden" name="totalAmount" th:value="${pkg.price}"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Event Date</label>
                            <input type="date" name="eventDate" class="form-control" required
                                   th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Number of Guests</label>
                            <input type="number" name="guestCount" class="form-control"
                                   min="1" th:max="${pkg.maxGuests}" required/>
                            <small class="text-muted">Maximum: <span th:text="${pkg.maxGuests}"></span></small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Venue Name</label>
                            <input type="text" name="venueName" class="form-control" placeholder="e.g. Rosewood Estate"/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Special Requests</label>
                            <textarea name="specialRequests" class="form-control" rows="3"
                                      placeholder="Any dietary requirements, special arrangements..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Confirm Booking
                            </button>
                            <a href="/packages" class="btn btn-outline-secondary flex-fill btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
