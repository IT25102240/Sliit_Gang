<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Bookings – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .page-header { background:linear-gradient(135deg,#7c3f58,#a0556e); color:#fff; padding:2.5rem 0; margin-bottom:2rem; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .status-pending { background:#fef3c7; color:#92400e; border-radius:6px; padding:2px 10px; font-size:.8rem; font-weight:600; }
        .status-confirmed { background:#d1fae5; color:#065f46; border-radius:6px; padding:2px 10px; font-size:.8rem; font-weight:600; }
        .status-cancelled { background:#fee2e2; color:#991b1b; border-radius:6px; padding:2px 10px; font-size:.8rem; font-weight:600; }
        .status-completed { background:#dbeafe; color:#1e40af; border-radius:6px; padding:2px 10px; font-size:.8rem; font-weight:600; }
        .card-header { background:#7c3f58; color:#fff; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-link" href="/packages">Packages</a>
            <a class="nav-link" th:if="${currentUser.role == 'admin'}" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/logout">Sign Out</a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-calendar-check me-2"></i>
                <span th:text="${currentUser.role == 'admin' ? 'All Bookings' : 'My Bookings'}"></span>
            </h2>
            <p class="mb-0 opacity-75">Daham's Component — Booking Management</p>
        </div>
        <a href="/packages" class="btn btn-light"><i class="bi bi-gift me-1"></i>Browse Packages</a>
    </div>
</div>

<!-- Flash messages -->
<div class="container mb-3" th:if="${success != null}">
    <div class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
</div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <i class="bi bi-calendar me-2"></i>Bookings (<span th:text="${bookings.size()}"></span>)
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Booking ID</th>
                            <th th:if="${currentUser.role == 'admin'}">Customer</th>
                            <th>Package</th>
                            <th>Event Date</th>
                            <th>Guests</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bookings}">
                            <td class="text-muted small" th:text="${b.bookingId}"></td>
                            <td th:if="${currentUser.role == 'admin'}" th:text="${b.userId}"></td>
                            <td class="fw-semibold" th:text="${b.packageName}"></td>
                            <td th:text="${b.eventDate}"></td>
                            <td th:text="${b.guestCount}"></td>
                            <td class="fw-semibold" th:text="'$' + ${b.totalAmount}"></td>
                            <td>
                                <span th:classappend="'status-' + ${b.status}" th:text="${b.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{/bookings/{id}(id=${b.bookingId})}" class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <form th:action="@{/bookings/delete/{id}(id=${b.bookingId})}" method="post" style="display:inline"
                                      onsubmit="return confirm('Delete this booking?')">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${bookings.isEmpty()}">
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-calendar" style="font-size:2rem;opacity:.2;"></i>
                                <p class="mt-2">No bookings yet. <a href="/packages">Browse packages</a> to get started.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div style="height:3rem;"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
