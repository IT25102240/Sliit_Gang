<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Package – EverAfter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background:#fdf8f4; } .navbar { background:#7c3f58 !important; } .navbar-brand,.nav-link { color:#fff !important; }
        .btn-primary { background:#7c3f58; border-color:#7c3f58; }
        .form-control:focus { border-color:#c4956a; box-shadow:0 0 0 .2rem rgba(196,149,106,.25); }
        .card-header { background:#7c3f58; color:#fff; }
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
    <a class="nav-link" href="/packages">Back</a>
</div></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header"><i class="bi bi-pencil me-2"></i>Edit Package</div>
                <div class="card-body p-4">
                    <form th:action="@{/packages/update/{id}(id=${pkg.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Package Name</label>
                            <input type="text" name="name" class="form-control" th:value="${pkg.name}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control" rows="3" th:text="${pkg.description}" required></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Price ($)</label>
                                <input type="number" name="price" class="form-control" th:value="${pkg.price}" step="0.01" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Max Guests</label>
                                <input type="number" name="maxGuests" class="form-control" th:value="${pkg.maxGuests}" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Vendor Name</label>
                                <input type="text" name="vendorName" class="form-control" th:value="${pkg.vendorName}" required/>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">Save Changes</button>
                            <a href="/packages" class="btn btn-outline-secondary flex-fill">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
