<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pkg.name} + ' – EverAfter'">Package Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root { --primary:#7c3f58; --accent:#c4956a; }
        body { background:#fdf8f4; font-family:'Segoe UI',sans-serif; }
        .navbar { background:var(--primary) !important; }
        .navbar-brand,.nav-link { color:#fff !important; }

        /* Hero image */
        .hero-img-wrap { position:relative; height:420px; border-radius:20px;
            overflow:hidden; margin-bottom:2rem; }
        .hero-img-wrap img { width:100%; height:100%; object-fit:cover; }
        .hero-img-overlay { position:absolute; inset:0;
            background:linear-gradient(to bottom, transparent 35%, rgba(60,20,35,.65)); }
        .hero-title { position:absolute; bottom:0; left:0; right:0;
            padding:1.5rem 2rem; color:#fff; }
        .hero-title h2 { font-weight:800; font-size:2rem; margin-bottom:.3rem; }
        .pkg-type-pill { display:inline-block; padding:.35rem 1.1rem; border-radius:20px;
            font-size:.8rem; font-weight:700; }
        .pill-basic   { background:rgba(209,250,229,.85); color:#065f46; }
        .pill-premium { background:rgba(252,231,243,.85); color:#9d174d; }

        /* Stat boxes */
        .stat-box { background:#fff; border:1px solid #e8d5c4; border-radius:14px;
            padding:1.25rem; text-align:center;
            box-shadow:0 2px 12px rgba(124,63,88,.06); }
        .stat-box .stat-icon { font-size:1.6rem; margin-bottom:.4rem; }
        .stat-box .stat-num  { font-weight:700; font-size:1.2rem; color:var(--primary); }
        .stat-box .stat-lbl  { font-size:.75rem; color:#999; }

        /* Price sidebar */
        .price-card { background:linear-gradient(135deg,var(--primary),#a0556e);
            color:#fff; border-radius:18px; padding:2rem; text-align:center; }
        .price-main { font-size:2.8rem; font-weight:900; line-height:1; }
        .price-disc { font-size:1rem; opacity:.75; margin-top:.3rem; }
        .price-strike { text-decoration:line-through; opacity:.55; font-size:.9rem; }

        /* Include chips */
        .include-chip { display:inline-block; background:#f3e8ee;
            color:var(--primary); border-radius:20px;
            padding:.35rem .9rem; font-size:.82rem;
            margin:.25rem; font-weight:500; }

        .btn-primary { background:var(--primary); border-color:var(--primary); }
        .btn-primary:hover { background:#6b3449; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex align-items-center">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-fill me-2"></i>EverAfter</a>
        <div class="d-flex gap-3 ms-auto align-items-center">
            <a class="nav-link" href="/packages"><i class="bi bi-arrow-left me-1"></i>All Packages</a>
            <th:block th:if="${currentUser != null}">
                <a class="nav-link" href="/profile">Profile</a>
                <a class="nav-link" href="/logout">Sign Out</a>
            </th:block>
            <th:block th:if="${currentUser == null}">
                <a class="nav-link" href="/login">Sign In</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row g-5">

        <!-- LEFT: image + info -->
        <div class="col-lg-8">

            <!-- Hero photo: Premium gets ballroom, Basic gets garden -->
            <div class="hero-img-wrap">
                <img th:src="${pkg.packageType == 'Premium'}
                    ? 'https://images.unsplash.com/photo-1606800052052-a08af7148866?w=1000&q=80'
                    : 'https://images.unsplash.com/photo-1519741497674-611481863552?w=1000&q=80'"
                     th:alt="${pkg.name}"/>
                <div class="hero-img-overlay"></div>
                <div class="hero-title">
                    <span th:if="${pkg.packageType == 'Basic'}"   class="pkg-type-pill pill-basic mb-2 d-inline-block">Basic</span>
                    <span th:if="${pkg.packageType == 'Premium'}" class="pkg-type-pill pill-premium mb-2 d-inline-block">Premium</span>
                    <h2 th:text="${pkg.name}"></h2>
                    <p class="mb-0 opacity-75">
                        by <strong th:text="${pkg.vendorName}"></strong>
                    </p>
                </div>
            </div>

            <!-- Description -->
            <p class="lead text-muted mb-4" th:text="${pkg.description}"></p>

            <!-- Stat boxes -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-icon" style="color:var(--primary);">👥</div>
                        <div class="stat-num" th:text="${pkg.maxGuests}"></div>
                        <div class="stat-lbl">Max Guests</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-icon" style="color:var(--accent);">🏷️</div>
                        <div class="stat-num" th:text="'$' + ${pkg.discountedPrice}"></div>
                        <div class="stat-lbl">After Discount</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-icon" style="color:#22c55e;">
                            <span th:if="${pkg.available}">✅</span>
                            <span th:if="${!pkg.available}">❌</span>
                        </div>
                        <div class="stat-num" th:text="${pkg.available ? 'Available' : 'Fully Booked'}"></div>
                        <div class="stat-lbl">Availability</div>
                    </div>
                </div>
            </div>

            <!-- Gallery strip: 3 extra wedding images -->
            <h6 class="fw-bold mb-3" style="color:var(--primary);">
                <i class="bi bi-images me-2"></i>Gallery
            </h6>
            <div class="row g-2 mb-4">
                <div class="col-4">
                    <img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=400&q=80"
                         alt="Wedding gallery" class="img-fluid rounded-3"
                         style="height:130px; object-fit:cover; width:100%;"/>
                </div>
                <div class="col-4">
                    <img src="https://images.unsplash.com/photo-1529636798458-92182e662485?w=400&q=80"
                         alt="Wedding gallery" class="img-fluid rounded-3"
                         style="height:130px; object-fit:cover; width:100%;"/>
                </div>
                <div class="col-4">
                    <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=400&q=80"
                         alt="Wedding gallery" class="img-fluid rounded-3"
                         style="height:130px; object-fit:cover; width:100%;"/>
                </div>
            </div>
        </div>

        <!-- RIGHT: price + booking -->
        <div class="col-lg-4">
            <div class="price-card mb-3">
                <div class="price-main" th:text="'$' + ${pkg.price}"></div>
                <div class="price-disc">
                    Discounted: <span th:text="'$' + ${pkg.discountedPrice}"></span>
                    <span th:if="${pkg.packageType == 'Basic'}"> (5% off)</span>
                    <span th:if="${pkg.packageType == 'Premium'}"> (10% off)</span>
                </div>
            </div>

            <th:block th:if="${currentUser != null}">
                <a th:href="@{/bookings/create/{id}(id=${pkg.id})}"
                   class="btn btn-primary w-100 btn-lg mb-2">
                    <i class="bi bi-calendar-plus me-2"></i>Book This Package
                </a>
            </th:block>
            <th:block th:if="${currentUser == null}">
                <a href="/login" class="btn btn-primary w-100 btn-lg mb-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Book
                </a>
            </th:block>
            <a href="/packages" class="btn btn-outline-secondary w-100 mb-4">
                View All Packages
            </a>

            <!-- Admin edit/delete buttons -->
            <th:block th:if="${currentUser != null and currentUser.role == 'admin'}">
                <div class="d-flex gap-2">
                    <a th:href="@{/packages/edit/{id}(id=${pkg.id})}"
                       class="btn btn-outline-primary flex-fill">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                    <form th:action="@{/packages/delete/{id}(id=${pkg.id})}" method="post"
                          onsubmit="return confirm('Delete this package?')">
                        <button type="submit" class="btn btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </th:block>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
